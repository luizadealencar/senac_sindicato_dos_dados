name: "Filiação ao Sindicato dos Dados"
description: "Preencha para entrar no quadro de filiados. Seu avatar vem do seu perfil do GitHub."
title: "Filiação: preencha o seu nome"
labels: ["filiacao"]
body:
  - type: input
    id: nome
    attributes:
      label: "Nome completo"
      placeholder: "Maria Fernanda Alves"
    validations:
      required: true
  - type: input
    id: celula
    attributes:
      label: "Nome do time (célula)"
      description: "Combine com seu grupo e escrevam IGUAL. Quem usa o mesmo nome cai na mesma célula do placar."
      placeholder: "Guardiões do SELECT"
    validations:
      required: true
