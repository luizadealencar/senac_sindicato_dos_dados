name: Filiação
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  adicionar:
    if: contains(join(github.event.issue.labels.*.name, ','), 'filiacao')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Adicionar filiado ao alunos.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body   = context.payload.issue.body || '';
            const autor  = context.payload.issue.user.login;
            const numero = context.payload.issue.number;

            // Formulário do GitHub gera blocos "### Rótulo\n\nvalor".
            // Quebramos por "### " e montamos um mapa rótulo -> valor.
            const campos = {};
            body.split(/^###\s+/m).forEach(bloco => {
              const linhas = bloco.split('\n');
              const rotulo = (linhas.shift() || '').trim().toLowerCase();
              const valor  = linhas.join('\n').trim();
              if (rotulo) campos[rotulo] = valor;
            });

            const acha = (...chaves) => {
              for (const c of chaves) {
                const k = Object.keys(campos).find(x => x.startsWith(c));
                if (k && campos[k] && campos[k] !== '_No response_') return campos[k];
              }
              return '';
            };

            const nome   = acha('nome completo', 'nome');
            const celula = acha('nome do time', 'time', 'célula', 'celula');

            const comentar = (msg) => github.rest.issues.createComment({
              ...context.repo, issue_number: numero, body: msg
            });

            if (!nome || !celula) {
              await comentar('Não consegui ler **nome** ou **time**. Edite a issue mantendo os campos do formulário e eu tento de novo.');
              return;
            }

            const arq = 'alunos.json';
            let lista = [];
            try { lista = JSON.parse(fs.readFileSync(arq, 'utf8')); } catch (e) { lista = []; }
            if (!Array.isArray(lista)) lista = [];

            const jaTem = lista.some(a => (a.github || '').toLowerCase() === autor.toLowerCase());
            if (jaTem) {
              await comentar('Você já está no quadro, @' + autor + '. Se quiser trocar de time, me avise. Fechando.');
              await github.rest.issues.update({ ...context.repo, issue_number: numero, state: 'closed' });
              return;
            }

            lista.push({ nome, github: autor, celula });
            fs.writeFileSync(arq, JSON.stringify(lista, null, 2) + '\n');

            await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']);
            await exec.exec('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
            await exec.exec('git', ['add', arq]);
            await exec.exec('git', ['commit', '-m', 'Filiação: ' + nome + ' (@' + autor + ')']);
            await exec.exec('git', ['push']);

            await comentar('Filiação registrada, @' + autor + '! Time: **' + celula + '**. Sua ficha aparece no quadro assim que o site publicar (1–2 min).');
            await github.rest.issues.update({ ...context.repo, issue_number: numero, state: 'closed' });
